landing.heading: "Alledaagse voorwerpen. Eeuwen Amsterdam."
landing.story: "Bij de opgravingen voor de Amsterdamse Noord/Zuidlijn kwamen voorwerpen aan het licht die langs de Amstel zijn gebruikt, verloren of weggegooid. Below the Surface vertelt met deze vondsten de geschiedenis van de stad."
landing.application: "Deze Survos-applicatie biedt een andere manier om de collectie te verkennen, met de oorspronkelijke Nederlandse gegevens en de aangeleverde Engelse vertalingen. Bezoek het oorspronkelijke project voor verhalen, fotografie en tentoonstellingen."
